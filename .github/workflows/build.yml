name: Build macOS
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish current version after successful tests
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Test models and cache fixtures
        run: |
          swiftc Localization.swift FavoritesIndex.swift PermissionCheck.swift IconSearchModel.swift IconPixels.swift Tests/main.swift -o /tmp/sif-model-tests
          /tmp/sif-model-tests
          swiftc Localization.swift Tests/Localization/main.swift -o /tmp/sif-localization-tests
          /tmp/sif-localization-tests
          python3 Tests/test-localization-catalog.py
          swiftc ReleaseModel.swift Tests/Updates/main.swift -o /tmp/sif-update-tests
          /tmp/sif-update-tests
          swiftc Localization.swift IconPixels.swift Personalization.swift Tests/Personalization/main.swift -o /tmp/sif-protection-tests
          /tmp/sif-protection-tests
          swiftc BackupInventory.swift Tests/Backups/main.swift -o /tmp/sif-backups-tests
          /tmp/sif-backups-tests
          swiftc Localization.swift IconPixels.swift IconCollection.swift Tests/Collections/main.swift -o /tmp/sif-collection-tests
          /tmp/sif-collection-tests
          swiftc Localization.swift IconPixels.swift DemoModel.swift Tests/Demo/main.swift -o /tmp/sif-demo-tests
          /tmp/sif-demo-tests
          python3 Tests/test-demo-isolation.py
          python3 Tests/test-reset.py
          python3 Tests/test-display.py
          node Tests/test-selection.js
          bash Testuj-renderowanie.command
      - name: Build application
        run: bash Zbuduj.command
      - name: Package styled DMG
        run: bash Packaging/BuildDMG.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SafariIconFixer-macOS
          path: dist/*.dmg
          if-no-files-found: error
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: build
    runs-on: macos-15
    concurrency:
      group: safari-icon-fixer-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: SafariIconFixer-macOS
          path: dist
      - name: Check current release is still main
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Sign DMG and appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash Packaging/SignRelease.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import plistlib; print(plistlib.load(open("Info.plist", "rb"))["CFBundleShortVersionString"])')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "$TAG"; fi
          REMOTE=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          TARGET=$(printf '%s\n' "$REMOTE" | awk -v ref="refs/tags/$TAG^{}" '$2 == ref {print $1}')
          if [[ -z "$TARGET" ]]; then TARGET=$(printf '%s\n' "$REMOTE" | awk 'NF {print $1; exit}'); fi
          if [[ -n "$TARGET" && "$TARGET" != "$GITHUB_SHA" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then exit 1; fi
            echo "Version already points to another commit; bump Info.plist to release."
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; not replacing assets."
            exit 0
          fi
          test -f dist/appcast.xml
          test -f dist/SHA256SUMS.txt
          if [[ -n "$TARGET" ]]; then
            gh release create "$TAG" dist/* --verify-tag --title "Safari Icon Fixer $VERSION" --notes-file RELEASE.md
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Safari Icon Fixer $VERSION" --notes-file RELEASE.md
          fi
